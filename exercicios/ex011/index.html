<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias flexiveis</title>
</head>
<body>
    <h1>Imagens dinamicas</h1>
    <p>Tente abrir em vários dispositivos diferentes ou simplesmente diminua e aumente o tamanho do navegador.</p>
    <picture>
        <source media="(max-width:710px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px )" srcset="imagens/foto-g.png" type="image/png">
        <img src="Imagens/foto-m.png" alt="imagem flexivel">
    </picture>
    <h1>Reproduzindo audio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
    <audio src="midia/give-to-me-straight.mp3.mp3"controls autoplay></audio>
    <!--MP3 WAV OGG-->

    <audio>
        <source src="midia/give-to-me-straight.mp3.mp3" type="audio/mpeg">
        <source src="midia/give-to-me-straight.mp3.ogg" type="audio/ogg">
        <source src="midia/give-to-me-straight.mp3.wav" type="audio/wav">
        <p>infelizmente não é possivel abrir o seu audio, <a href="midia/give-to-me-straight.mp3.mp3">Clique aqui para baixar o audio</a></p>
        <!--Não usar wav porque é bem pesado.-->
     
    </audio>
</body>
</html>
